[package]
name = "ssx-bevy"
description = "The game on Bevy: rendering, audio, the UI's drawing, the game shell; used by the game and the asset viewer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
shader-check = ["wgpu/noop", "wgpu/wgsl"]
net = ["dep:ssx-net", "dep:ssx-net-proto", "dep:ssx-net-join", "dep:ssx-gameplay", "ssx-ui/net", "ssx-script?/wire"]
scripts = ["dep:ssx-script"]

[dependencies]
ssx-assets.workspace = true
ssx-content = { workspace = true, features = ["shader"] }
ssx-core = { workspace = true, features = ["log"] }
ssx-files.workspace = true
ssx-movie.workspace = true
ssx-formats.workspace = true
ssx-lua.workspace = true
bevy = { workspace = true, features = ["default"] }
cpal.workspace = true
anyhow.workspace = true
clap.workspace = true
ssx-physics.workspace = true
ssx-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = { version = "30.0.1", default-features = false }
naga.workspace = true
wgpu-naga-bridge = "30.0.1"
wesl.workspace = true
half.workspace = true
ssx-net = { workspace = true, optional = true }
ssx-net-proto = { workspace = true, optional = true }
ssx-net-join = { workspace = true, optional = true }
ssx-gameplay = { workspace = true, optional = true }
ssx-script = { workspace = true, optional = true }

[dev-dependencies]
ssx-core = { workspace = true, features = ["dev-master"] }
wgpu = { version = "30.0.1", default-features = false, features = ["noop", "wgsl"] }

[lints]
workspace = true
