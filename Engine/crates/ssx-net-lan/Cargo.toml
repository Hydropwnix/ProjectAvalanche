[package]
name = "ssx-net-lan"
description = "The machine's IPv4 interfaces for multiplayer LAN discovery (port feature): addresses, masks, the broadcast address per interface, on-link checks. Shared by the dedicated server and the server browser. No Bevy, no network library."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[lints]
workspace = true
