[package]
name = "ssx-movie"
description = "Mod movies decoded: AV1 pictures through rav1d, Vorbis audio through symphonia, read by ssx-content's WebM reader (port feature: modding)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["asm"]
asm = ["rav1d/asm"]
sandbox-probe = []

[dependencies]
ssx-content.workspace = true
ssx-core.workspace = true
rav1d.workspace = true
symphonia.workspace = true
libc.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
seccompiler.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
libtest-mimic.workspace = true

[[bin]]
name = "avalanche-movie"
path = "src/bin/avalanche-movie.rs"

[[bin]]
name = "avalanche-movie-probe"
path = "src/bin/avalanche-movie-probe/main.rs"
required-features = ["sandbox-probe"]

[[test]]
name = "sandbox"
harness = false
required-features = ["sandbox-probe"]

[lints]
workspace = true
