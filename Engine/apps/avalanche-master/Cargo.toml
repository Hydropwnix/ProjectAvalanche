[package]
name = "avalanche-master"
description = "Project Avalanche's master server (port feature): the list of public multiplayer servers — heartbeats boxed with the servers' identity keys, the reachability check, expiry, blocklists. No Bevy, no game crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "avalanche-master"
path = "src/main.rs"

[dependencies]
ssx-net-proto.workspace = true
ssx-core = { workspace = true, features = ["log"] }
bytes.workspace = true
clap.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["client", "server"] }
rcgen.workspace = true

[lints]
workspace = true
