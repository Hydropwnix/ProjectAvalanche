[package]
name = "avalanche-launcher"
description = "Project Avalanche launcher: one-time data setup from the SSX (2012) disc image, then starts the game (or the asset viewer)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "project-avalanche"
path = "src/main.rs"

[dependencies]
ssx-assets.workspace = true
ssx-formats.workspace = true
anyhow.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
ureq.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
sha2.workspace = true
semver.workspace = true
tar.workspace = true
flate2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
